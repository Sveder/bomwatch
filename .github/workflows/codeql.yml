name: codeql

# Results go to the Security tab only when code scanning is on for the repo
# (Settings > Code security; private repos need GitHub Advanced Security).
# Turn uploads on with the repository variable CODE_SCANNING=true
# (Settings > Secrets and variables > Actions > Variables). Until then the
# SARIF results are kept as a workflow artifact.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ vars.CODE_SCANNING == 'true' && 'always' || 'never' }}
          output: codeql-results
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
