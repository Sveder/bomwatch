[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bomwatch"
version = "0.1.0"
description = "Software bill of materials for a machine, with alerts when new software appears."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Michael Sveder" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["black", "pylint", "pytest", "pytest-cov"]

[project.scripts]
bomwatch = "bomwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bomwatch --cov-branch --cov-report=term-missing --cov-fail-under=85"

[tool.pylint.main]
fail-under = 9.5

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.black]
target-version = ["py310"]
